{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 520px;">
    <div class="card shadow-sm"><div class="card-body">
        {% if validlink %}
            <h2>Set your password</h2>
            <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Save password</button></form>
        {% else %}
            <h2>Invalid link</h2><p class="mb-0">This password setup link is invalid or expired.</p>
        {% endif %}
    </div></div>
</div>
{% endblock %}
