{% extends "base.html" %}
{% block content %}
<div class="container-fluid"><div class="card shadow-sm"><div class="card-body"><h2 class="mb-4">{{ title }}</h2><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Save</button><a href="{% url 'my_leaves' %}" class="btn btn-secondary">Cancel</a></form></div></div></div>
{% endblock %}
